# Профиль «Лабораторная линия МАИ» (каф. 307) по измерениям М. А. Коробкова.
#
# Источник — Коробков М. А. «Разработка метода оценки выхода годных печатных плат по их конструктивно-
# технологическим параметрам»: дис. … канд. техн. наук, 2.2.9, МАИ, 2025 (страницы — в комментариях;
# выписка — ДИПЛОМ/research_notes/Коробков/dissertation_2025.md). Линия: фотошаблоны с лазерного принтера
# 1200 dpi или установка прямого экспонирования на ЖК-матрице, сухой плёночный резист 40 мкм, фольга 18 мкм.
# Чего у автора нет (межслойное совмещение, масштаб, увод сверла, маска, процесс травления для B1), берётся
# из профиля открытых данных (meta.base). Числа автора измерены на тест-купонах и калибровочных шаблонах,
# а не на рассовмещении реальной меди с отверстиями.

[meta]
name = "Лабораторная линия МАИ (Коробков 2025)"
kind = "lab"
base = "open_data.toml"
illustrative = false

[etch]
etch_factor = 2.3                 # с. 66, рис. 26б: микрошлиф тест-купона, лабораторная установка (промышленная — 4,3)
resist_thickness_um = 40          # с. 49: сухой плёночный негативный резист 40 мкм
resist_resolution_um = 150        # оценка по с. 53, 63–64, 124: зазоры < 150 мкм не воспроизводятся (лазерные
                                  #   фотошаблоны; 150/150 достигнуто только с компенсацией; ЖК-установка — тоже 150)
clearance_table_inner_um = []     # таблицы зазоров заводов (open_data) к линии не относятся — зазор по модели
clearance_table_outer_um = []     #   s = max(g_res, (t_e + t_r)/AR) + 2t_e/EF + m
process_margin_um = 0             # запас заводов из open_data не нужен: g_res = 150 — уже предел, достигнутый на линии
etch_factor_tolerance = 0         # разброс EF у автора не измерен (одна оценка 2,3); разброс ширины учтён в [yield]
finished_width_min_um = 190       # с. 63: наименьшая ширина при P = 0,97 после компенсации для класса 3 (допуск
                                  #   ±20 %, σ = 18 мкм — только фотолитография; разброс травления не входит —
                                  #   допущение: ширина рисунка резиста принята за готовую); для класса 2 по коду
                                  #   автора (k_max = 0,3, с. 244) было бы ≈ 172 — взято консервативное 190;
                                  #   для класса 1 — 130 мкм
# plating_um = 25 и outer_etched_plating_um = 15 — из открытых данных: у автора ОПП без металлизации (с. 167–168),
#   для двусторонних плат линии гальваника принята как у типичного завода (допущение)

[yield]
enabled = true
litho_sigma_um = 18               # с. 60: СКО ширины после экспонирования (среднее по направлениям)
etch_edge_sigma_um = "h/F"        # с. 72: допущение автора — σ края при травлении равна подтраву h/F
bias_um = 0                       # с. 62–63: после компенсации c(w) = −δ_expo(w) смещение среднего ≈ 0

[drilling]
sigma_drill_um = 10               # с. 82–83: σ положения сверла «современных станков» (литература [100]; на линии
                                  #   МАИ не измерено)
sigma_outer_pattern_um = 28.3     # с. 155: ЖК-установка, совмещение по конечно-элементной сетке — σ = 30 мкм на
                                  #   калибровочном шаблоне (аффинная матрица — 90 по X / 70 по Y, с. 154). В общем
                                  #   методе (с. 168) автор берёт 0,03 мм как σ совмещения ВМЕСТЕ со сверлением, а
                                  #   правила добавляют σ сверла отдельно, поэтому здесь √(30² − 10²) = 28,3
# sigma_layer_um — у автора нет (ОПП/ДПП); остаётся 30 из открытых данных. Для МПП по Можарову (рис. 10, с. 36)
#   RSS этапов 8, 9, 15, 11, 48, 10 ≈ 54 мкм — пессимистичная альтернатива

[annular_ring]
probability_max = 3.0e-3          # с. 94, 102 (табл. 5): требуемая вероятность годной площадки 0,997 (у автора без
                                  #   источника; на с. 157 — «обычно на предприятиях» для заготовки целиком)
