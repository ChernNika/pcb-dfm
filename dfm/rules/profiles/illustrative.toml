# Профиль изготовителя: УСЛОВНЫЙ завод из документов по классам A1, A3, A5, A7.
#
# Все числа — иллюстративные параметры примеров документов, а НЕ значения стандартов IPC и не
# данные реального завода. Каждая находка, посчитанная по этому профилю, помечается
# data_quality = «условный профиль». Для работы с настоящим заводом скопируйте файл и замените
# числа (python -m dfm check плата --profile мой.toml).
#
# Единицы: длины — мкм (суффикс _um) или мм (_mm), вероятности — доли.

[meta]
name = "Условный завод (иллюстративные числа документов)"
illustrative = true

# ---------- A1: травление, ширина и зазоры (документ A1, раздел 5) ----------
[etch]
etch_factor = 3.0                 # EF: глубина травления / подтрав
etch_factor_tolerance = 0.3       # разброс EF (±)
resist_resolution_um = 50         # g_res: самая узкая щель, которую проявляет резист
plating_um = 25                   # гальваника на наружных слоях (добавляется к фольге стека)
outer_includes_plating = false    # true — толщина наружной меди в стеке уже включает гальванику
finished_width_min_um = 75        # гарантированная готовая ширина проводника
target_level = "B"                # целевой уровень сложности IPC-2221C §1.6.3 — справочно, правилами не читается
product_class = 2                 # класс изделия IPC-2221C §1.6.2 — один на все правила (A1 Д9, A3, A5)

# Таблица завода «толщина меди → минимальный зазор» (если задана, порог по ней, иначе — модель
# s_min = g_res + 2t/EF). Документ A1, раздел 5.5: (18; 75), (35; 90), (70; 125) мкм — пример
# калибровки; по умолчанию не используется, чтобы пороги шли из той же модели, что в примерах.
# clearance_table_um = [[18, 75], [35, 90], [70, 125]]

# Пороги для уровней A и C (для вердикта в четыре ступени) в документах не заданы: если завод
# их даёт, впишите { clearance_um = …, width_um = … }. Без них «информация» не выдаётся, а всё
# ниже целевого уровня — ошибка (консервативно, документ A1, раздел 5.8).
# [etch.level_A]
# [etch.level_C]

# ---------- A7: паяльная маска (документ A7, разделы 2 и 4) ----------
[mask]
exposure = "photo"                # photo — фотошаблон, ldi — прямое лазерное экспонирование
registration_3sigma_um = { photo = 75, ldi = 30 }
scale_sigma_ppm = 25              # случайная масштабная ошибка
panel_half_diagonal_mm = 250      # худший случай для маски — угол заготовки (≈ 350 × 350 мм; допущение). Не то же,
                                  #   что drilling.scale_radius_mm: там типичное удаление платы от центра (150)
color = "green"
dam_min_um = { green = 100, black = 125, white = 125 }
peel_w50_um = { green = 60, black = 80, white = 80 }     # кривые отслоения — условные
peel_slope_um = { green = 8, black = 10, white = 10 }
edge_strip_min_um = 100
thickness_um = 25                 # средняя толщина сухой маски
levelling_beta = 0.5              # 0 — конформно, 1 — плоско
over_conductor_min_um = 10
bga_min_pads = 16                 # М7: от скольких круглых площадок компонента (медь ±30 % от медианы) — матрица

# паста для М5 (документ A7, раздел 5.5 — иллюстративно)
[paste]
stencil_um = 100                  # толщина трафарета
metal_fraction = 0.5              # доля металла в объёме пасты
transfer = 0.9                    # доля переноса пасты

# ---------- A3: сверление и совмещение (документ A3, раздел 2) ----------
[drilling]
drill_is_finished = true          # в KiCad drill — готовый диаметр (поправка документа A3)
plating_um = 25                   # металлизация ствола
allowance_um = 0                  # припуск на сверло: d_св = d + 2·t_мет + Δ
sigma_drill_um = 15               # положение сверла
wander_um_per_mm = 5              # увод сверла c_w
sigma_outer_pattern_um = 8        # совмещение наружного рисунка с отверстиями
sigma_layer_um = 25               # межслойное совмещение (общее для заготовки)
scale_sigma_ppm = 25              # остаточный масштаб
scale_radius_mm = 150
systematic_scale_ppm = 0          # некомпенсированный масштаб → систематический сдвиг (К6)
sigma_microvia_um = 25            # совмещение лазера (К7)
microvia_max_mm = 0.15            # отверстие между соседними слоями не больше — микроотверстие
microvia_bottom_ratio = 0.8       # диаметр дна / верхний диаметр (0,10 → 0,08 мм)
wander_share_min = 0.25           # К8: доля увода в σ² нижнего слоя, начиная с которой он заметен
ring_from = "finished"            # поясок от готового отверстия; "drill" — от сверла d + 2t + Δ
teardrop_mc = 200000              # К3: испытаний моделирования выхода у трассы (20 000 дают ±0,1 % при 0,8 %)
k3_criterion = "junction"         # К3: junction — перемычки до углов стыка ≥ (1 − k)·w (Коробков 2025, ф. (37), (41));
                                  #   strip — любой выход в полосе w + 60 мкм (документ A3, раздел 4.3)

[annular_ring]
# требуемый поясок, мкм: класс 2 — без выхода (строже нормы: ГОСТ Р 55693 табл. 9 допускает разрыв до 90°,
# см. open_data.toml breakout_allowed_deg); класс 3 — наружный 50, внутренний 25 (ГОСТ Р 55693-2013, табл. 9)
required_um = { class2 = { outer = 0, inner = 0 }, class3 = { outer = 50, inner = 25 } }
probability_max = 1.0e-3          # допустимая вероятность выхода P*

# ---------- A5: сплошные слои (документ A5, раздел 5) ----------
[planes]
wicking_max_um = 25               # ℓ_w: затекание меди — число примера документа A5 (условное; проектное по
                                  # ECSS-Q-ST-70-12C Rev.1 п. 13.8.2g — 50 мкм, приёмка ГОСТ Р 55693 табл. 10 — 100 мкм для кл. 2)
clearance_req_um = 100            # c_тр: требуемый зазор от ствола до меди слоя (условно)
web_min_mm = 0.10                 # w_min: перемычка между вскрытиями уже — предупреждение (З6)
web_info_mm = 0.14                # перемычка уже — информация (рисунок 9 документа A5)
breach_probability_max = 1.0e-3   # P* для нужного диаметра вскрытия
check_fresh_fill = true           # A1 Д3 и A5 З8: сравнить сохранённую заливку со свежей (копия перезаливается в KiCad)
plane_fill_fraction = 0.5         # слой считается сплошным, если заливка покрывает ≥ доли платы
caf_n = 2                         # показатель модели проводящей нити t ∝ L_эфф^n / V^m (условно)
field_grid_um = 10                # шаг сетки расчёта проводимости окна поля (З5, З6)
field_min_holes = 4               # поле — от стольких отверстий (меньше — сводкой)
field_conductance_min_holes = 9   # проводимость окна — для полей от стольких отверстий
fields_per_layer = 5              # отдельными находками — столько крупнейших полей слоя
field_max_cells = 250000          # ограничение размера сетки окна

# ---------- B1: кислотные ловушки и шипы (документ B1, главы 2–4, 6) ----------
[b1]
process = "З"                     # профиль процесса: С, О, З; без купона — консервативный З (раздел 3.7)
method = "nn"                     # nn — гибрид (формула клина + поправка сети), formula — формула клина по θ_эфф,
                                  # doc_table — таблица документа (раздел 3.6: С/О/З, медь 35 мкм, от 15°)
calibrated = false                # true — профиль процесса подтверждён купоном с клиньями (раздел 3.7):
                                  # только тогда вердикт «ошибка»; без купона — не выше предупреждения
p_warning = 0.05                  # гибрид: P(сужение > τ) — с этой вероятности предупреждение (ниже — информация);
y_warning = 0.75                  # формула: предупреждение с сужения y_warning·τ. Оба — наименее строгие пороги
                                  # с полнотой ≥ 0,95 (раздел 9.2) на проверочных частях (research/b1_nn/warning_threshold.md)
consequence = { "сигнал" = 10, "питание" = 30 }   # тяжесть для ожидаемого ущерба (раздел 6.2)
tau = "class"                     # допуск: перетрав больше tau·w — сужение сверх допуска; "class" — по классу изделия
                                  # ([yield].k_width: 0,2 для классов 2–3, 0,3 для класса 1 — ГОСТ Р 55693 п. 5.7.4.2,
                                  # IPC-6012C п. 3.5.3.1, IPC-A-600G п. 2.10.1.1) или число
delta_um = 50                     # δ — толщина диффузионного слоя: карман — куда не входит круг δ
ell_um = 50                       # масштаб угла (устойчивость к разбиению дуг, раздел 4.4)
theta_max_deg = 90                # фильтр кандидатов в ловушки (не вердикт)
phi_max_deg = 90                  # фильтр кандидатов в шипы
report_min_um = 2                 # перетрав меньше — не находка (недотрав и безопасные карманы скрыты)
resist_b50_um = 60                # ширина полоски резиста с отрывом 50 % (купон документа B2)
# шип: площадь хрупкого кончика резиста относительно прямого угла — ПОРОГИ УСЛОВНЫЕ (документ даёт
# только показатель; абсолютную вероятность отрыва нужно мерить купоном с шипами)
spike_ratio_info = 1.5
spike_ratio_warning = 3.0
corona_margin = 1.5               # Л8: запас k_s, V_кор ≥ k_s·ΔV (документ B1, Л8 — значение примера, условное)
angles_deg = [15.0, 20.0, 30.0, 45.0, 60.0, 90.0, 120.0]
# параметры профилей процесса (документ B1, раздел 2.7): Da и промывка u_r — вход формулы клина и гибрида;
# свой процесс — ещё строка, например "МАИ" = { Da = …, u_r_um = … }, и process = "МАИ"
[b1.process_params]
"С" = { Da = 0.3, u_r_um = 0.0 }
"О" = { Da = 3.0, u_r_um = 0.5 }
"З" = { Da = 3.0, u_r_um = 2.0 }

# наибольший перетрав стенки кармана, мкм, по численной модели (раздел 3.6, research/b1/wall_summary.json);
# таблица посчитана для меди 35 мкм (u = 12 мкм) — только для method = "doc_table"
[b1.overetch_um]
"С" = [-0.03, -0.07, -0.19, -0.33, -0.38, -0.36, -0.24]
"О" = [4.04, 0.04, -0.05, -0.22, -0.37, -0.41, -0.39]
"З" = [52.15, 24.92, 5.3, 0.34, 0.04, -0.18, -0.26]

# ---------- A1 Д9: вероятность выйти за допуск приёмки по ширине и зазору (Коробков 2025, гл. 2) ----------
[yield]
enabled = false                   # нужны σ процесса завода (включено в mai_lab.toml)
litho_sigma_um = 5.7              # σ ширины после экспонирования = √2·ξ; ξ = 4 мкм — «производственные условия»
                                  #   Коробкова (диссертация, с. 74, в паре с F = 5; у автора без источника)
combine = "worst"                 # слой — по самой узкой трассе и зазору (как у автора, с. 162–163); "product" —
                                  #   произведение по всем трассам и зазорам (допущение независимости)
etch_edge_sigma_um = "h/F"        # σ края при травлении: "h/F" — допущение автора (весь подтрав, с. 72) или число
bias_um = 0                       # смещение ширины после CAM-компенсации (рост ширины > 0)
k_width = { class1 = 0.3, class2 = 0.2, class3 = 0.2 }   # допуск сужения проводника: ГОСТ Р 55693 п. 5.7.4.2,
                                                         #   IPC-6012C п. 3.5.3.1, IPC-A-600G п. 2.10.1.1 (по Коробкову, с. 44)
k_gap = { class1 = 0.3, class2 = 0.3, class3 = 0.2 }     # допуск сужения зазора, IPC-A-600G п. 2.10.1.2

# ---------- вердикты (документ A7, раздел 4.3) ----------
[verdict]
# вероятностная шкала на плату: < info — норма, < warning — информация, < error — предупреждение
probability_info = 1.0e-3
probability_warning = 1.0e-2
probability_error = 1.0e-1

# ---------- электрика (A1 Д5–Д7): данных нет — проверки «невыполнены» ----------
[nets]
# напряжения цепей, В: число — постоянное или ПИКОВОЕ; переменное — { rms = 230, tolerance = 0.1 }
# (пик √2·U·(1 + κ), κ по умолчанию 10 % по ГОСТ 32144-2013): { "VIN" = 12.0, "MAINS_L" = { rms = 230 } }
voltages = {}
# высота над уровнем моря, м (Д5: выше 3050 м открытая медь — категория B3 вместо B2): altitude_m = 0
# цепи питания (B1: тяжесть последствий 30 вместо 10, документ B1, раздел 6.2): power_nets = ["VBUS"]
# токи цепей, А: { "VBUS" = 2.0 }
currents = {}
temperature_rise_c = 10           # Д7: допустимый перегрев трассы, °C (документ A1, раздел 6.7; IPC-2221 рис. 6-4 —
                                  #   кривая 10 °C — обычный выбор конструктора)
# высота над уровнем моря: колонка B3 (ГОСТ Р 53429 табл. 9 — при 53,6 кПа, ≈ 5 км) включается выше 3050 м
#   (граница IPC-2221C); между 3 и 5 км проверка консервативна, выше 5 км таблицы нет — зазор не обоснован
# Таблица «разность напряжений, В (пик) → зазор, мм» по категориям мест: B1 — внутренний слой, B2 — открытая
# медь (B3 — выше 3050 м), B4 — под маской. Открытые источники: ГОСТ Р 53429-2009, табл. 7–9; ECSS-Q-ST-70-12C
# Rev.1, Table 133 (числа — отчёт «Источники параметров DFM профиля»). В этот условный профиль не
# вписаны; без таблицы Д5 и З7 «невыполнены».
# voltage_table = { B2 = [[V1, D1], [V2, D2], …] }     # V — В, D — мм, строки по возрастанию V
