# Профиль по ОТКРЫТЫМ ДАННЫМ: типичный завод, класс функционирования 2.
#
# Источники — отчёты ДИПЛОМ/reports/«Источники параметров DFM профиля» и «Исправление спорных параметров DFM»:
# ГОСТ Р 53429-2009, ГОСТ Р 55693-2013, ГОСТ Р 56251-2014, ECSS-Q-ST-70-12C Rev.1 и ECSS-Q-ST-70-60C Rev.1
# (2025), опубликованные нормы заводов (Резонит, Eurocircuits, Würth, Multi-CB, JLCPCB, PCBWay, AdvancedPCB),
# технические описания материалов, измерения NASA GSFC. У каждого числа — источник или пометка «расчёт»
# (выведено из источников) / «допущение» (опоры нет — параметр анализа чувствительности).
# Это не данные одного завода: находки помечаются «открытые данные». Числа ГОСТ — по копиям на meganorm;
# перед цитированием в ВКР сверить с официальным текстом (ФГИС «Стандарты»).
# Профиль накладывается на условный (illustrative.toml): что здесь не задано (B1 и алгоритмические
# настройки), берётся оттуда.

[meta]
name = "Открытые данные: ГОСТ Р + ECSS + опубликованные нормы заводов (класс 2)"
illustrative = false
kind = "open_data"

# ---------- A1: травление, ширина и зазоры ----------
[etch]
etch_factor = 3.0                # физический EF хлорида меди 3:1 (Chemcut Bulletin 8) = CAM-компенсация ≈ t/2,8
                                 #   на сторону (Prototron/Thompson 2009, 2016)
etch_factor_tolerance = 1.0      # EF 2–4 (Chemcut; Ball «Thoughts on Undercut») — допущение, для разброса ширины
resist_resolution_um = 50        # g_res: Riston FX250 (резист 50 мкм) — 50 мкм; Photec H-8050 — 60 мкм
resist_thickness_um = 35         # t_r: сухой плёночный резист 30–40 мкм (Ball 2024; Photec, Riston) — допущение
slot_aspect_max = 0.91           # AR: расчёт — подгонка модели к 43 точкам 11 таблиц заводов (с. к. о. 12 мкм)
process_margin_um = 25           # m: расчёт — запасы стандартных уровней заводов −10…+39 мкм
plating_um = 25                  # гальваника наружных слоёв: ГОСТ Р 55693 табл. 4/13; ECSS-Q-ST-70-12C п. 7.2
outer_etched_plating_um = 15     # часть гальваники, стравливаемая с фольгой: 0 — pattern plating, 25–35 — panel;
                                 #   компромисс — допущение (процесс большинства заводов не опубликован)
outer_includes_plating = false   # толщина наружной меди в стеке KiCad — фольга
finished_width_min_um = 100      # ГОСТ Р 53429 табл. 2 (класс 5); Резонит «продвинутый»; JLCPCB; Multi-CB
target_level = "B"               # уровень производимости, IPC-2221C (Dec 2023) п. 1.6.3 — справочно, правилами не читается
product_class = 2                # ГОСТ Р 55693-2013 табл. 2 (по умолчанию класс 2); IPC-2221C п. 1.6.2
# таблицы «фольга, мкм → минимальный зазор, мкм» (по фольге до металлизации, как публикуют заводы):
# внутренние — медиана Würth CBT / PCBWay / Eurocircuits / AdvancedPCB / Multi-CB / Резонит (100/126/190/252)
#   и модель при m = 25 (95/125/187/249) — расчёт, округлено до 5 мкм;
# наружные — модель при t_plate = 15, m = 25 (122/152/214/275) и медиана заводов (≈ 110/145/230/305) — расчёт
clearance_table_inner_um = [[18, 100], [35, 125], [70, 190], [105, 250]]
clearance_table_outer_um = [[18, 125], [35, 150], [70, 225], [105, 300]]

# ---------- A7: паяльная маска и паста ----------
[mask]
exposure = "photo"               # консервативно: способ экспонирования большинство заводов не публикует
registration_3sigma_um = { photo = 75, ldi = 30 }   # Altium 2025 ±50–75; IPC S12-1 ±50–65; Eurocircuits LDI 0,030
dam_min_um = { green = 100, black = 150, white = 150 }   # Резонит; ECSS-Q-ST-70-12C п. 7.8.2 ≥ 100; JLCPCB 0,10/0,13
over_conductor_min_um = 10       # JLCPCB ≥ 10 мкм; Multi-CB > 10 мкм
thickness_um = 25                # Würth 20–45 мкм по основанию; Lentz ≥ 0,8 mil по ламинату
# scale_sigma_ppm, panel_half_diagonal_mm, peel_*, edge_strip_min_um, levelling_beta — из условного: допущения

[paste]
metal_fraction = 0.5             # Indium: 0,40–0,54 по объёму; SAC305 88–89 % по массе (расчёт 0,50–0,53)
transfer = 0.8                   # Shea et al. (IPC): TE ≥ 80 % при отношении площадей > 0,66
# stencil_um = 100 — из условного: допущение (IPC-7525 не прочитан)

# ---------- A3: сверление и совмещение ----------
[drilling]
drill_is_finished = true         # KiCad drill — готовое отверстие
plating_um = 25                  # Eurocircuits ≈ 20–25 мкм; ГОСТ Р 55693 табл. 4: 20 (кл. 1–2) / 25 (кл. 3)
allowance_um = 50                # сверло = готовое + 2·25 + 50 = готовое + 0,10 мм: Eurocircuits TOOLSIZE =
                                 #   ENDSIZE + 0.100mm; ECSS-Q-ST-70-12C Rev.1 п. 7.5.3 (a = +0,10, ENIG); Summit
via_allowance_um = 50            # как PTH; завод вправе уменьшить (ECSS «can be zero for vias»)
allowance_by_finish_um = { ENIG = 50, HASL = 100, SnPb = 100 }   # HASL +0,15 мм (Summit .006"; Würth, PCBWay)
sigma_drill_um = 15              # производственная σ: между паспортом станка (≈ 3) и Isola US 6,658,375 (25)
sigma_outer_pattern_um = 20      # расчёт: √((100/4)² − 15²); ±0,10 мм «отверстие → рисунок» — Würth, Multi-CB
sigma_layer_um = 30              # расчёт: суммарная σ внутр. ≈ 34 (±0,15 мм Multi-CB / 4,4; MCL); NASA GSFC 19–32
registration_k = 4.0             # σ = T/k, k = 4 ≈ Cpk 1,33 (3 — консервативно, 5 — Cpk 1,67): допущение
# registration_tol_um = { outer = 100, inner = 150 }   # вместо σ выше: допуски завода → σ выводится сам
scale_sigma_ppm = 25             # допущение; диапазон 10–100 ppm
scale_radius_mm = 150            # допущение: ≈ половина рабочего поля заготовки
microvia_max_mm = 0.15           # ГОСТ Р 55693 табл. 4, примечание
# wander_um_per_mm = 5, sigma_microvia_um = 25, microvia_bottom_ratio = 0.8 — из условного: допущения

[annular_ring]
ring_base_outer = "plated"       # наружный поясок — от внутренней поверхности металлизации (ГОСТ Р 55693 п. 5.7.3;
                                 #   ECSS-Q-ST-70-60C Rev.1 п. 10.6.1, Table 10-2)
ring_base_inner = "drill"        # внутренний — от стенки сверления (ГОСТ Р 55693 п. 5.9.4.10; ECSS-70-60
                                 #   Table 10-1 «from the hole wall… excluding plated copper»)
breakout_allowed_deg = { class2 = 90.0 }   # класс 2: разрыв пояска до 90° допустим (ГОСТ Р 55693 табл. 9; IPC-6012)
required_um = { class2 = { outer = 0, inner = 0 }, class3 = { outer = 50, inner = 25 } }   # ГОСТ Р 55693 табл. 9
probability_max = 1.0e-3         # допущение (нормы вероятности нет)

# ---------- A5: сплошные слои ----------
[planes]
wicking_design_um = 50           # ECSS-Q-ST-70-12C Rev.1 п. 13.8.2g: «include an additional spacing of 50 µm to allow
                                 #   for wicking»; = предел приёмки ECSS-Q-ST-70-60C Rev.1 Table 10-6 (≤ 50 мкм)
wicking_accept_max_um = { class1 = 125, class2 = 100, class3 = 80 }   # ГОСТ Р 55693-2013 п. 5.9.4.1 табл. 10;
                                 #   IPC-6012F Table 3-8 — только предупреждение о худшем допустимом случае
etchback_um = 0                  # подтрав диэлектрика не заказан (для класса 2 не обязателен); если задан — ≤ 20 мкм
                                 #   (ECSS-Q-ST-70-60C Rev.1, Table 10-5) или 5–80 мкм (ГОСТ Р 55693 п. 5.9.4.7)
clearance_req_um = 104           # ECSS-Q-ST-70-12C Rev.1 прим. к п. 13.8.2d: 130 − 26 мкм (0–30 В); 104 + 50 = 154 =
                                 #   Table 133 «X,Y internal conductor to hole wall»
web_min_mm = 0.127               # AdvancedPCB Aurora 2026: перемычка между вскрытиями 0,005" (Standard)
# web_info_mm, breach_probability_max, plane_fill_fraction, caf_n, поля — из условного: допущения / алгоритм

# ---------- электрика ----------
[nets]
# «разность напряжений, В (пик) → зазор, мм»; первая строка с V ≥ ΔU даёт зазор.
# B2, B4: ГОСТ Р 53429-2009 табл. 9, стеклоткань, нормальные условия (маска как изоляция не засчитана);
# B3: та же таблица, давление 53 600 Па; B1: ECSS-Q-ST-70-12C Rev.1 Table 133 (внутренние, 104 мкм до 30 В,
# «1 мкм/В и не меньше 150 мкм» до 500 В). Строки ГОСТ получены обращением табл. 9 — сверить с официальным текстом;
# ГОСТ называет величину «рабочим напряжением», код сравнивает пиковое — консервативно.
voltage_table = { B2 = [[10, 0.05], [15, 0.075], [25, 0.10], [50, 0.20], [150, 0.30], [300, 0.40], [400, 0.70], [600, 1.20], [830, 2.00], [1160, 3.50], [1500, 5.00], [2000, 7.50], [2300, 10.00]], B4 = [[10, 0.05], [15, 0.075], [25, 0.10], [50, 0.20], [150, 0.30], [300, 0.40], [400, 0.70], [600, 1.20], [830, 2.00], [1160, 3.50], [1500, 5.00], [2000, 7.50], [2300, 10.00]], B3 = [[8, 0.05], [12, 0.075], [20, 0.10], [40, 0.20], [110, 0.30], [160, 0.40], [200, 0.70], [300, 1.20], [400, 2.00], [560, 3.50], [660, 5.00], [1000, 7.50], [1160, 10.00]], B1 = [[30, 0.104], [150, 0.150], [200, 0.200], [300, 0.300], [400, 0.400], [500, 0.500]] }
voltage_slope_mm_per_v = { B1 = 0.001 }   # ECSS: 1 мкм/В (до 500 В; выше — вне стандарта)
