<a href="./" style="position:fixed;right:16px;bottom:16px;z-index:9999;padding:10px 16px;border-radius:8px;background:#1f6feb;color:#fff;font:600 14px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25)">⟳ Проверить снова</a>
<script>
(() => {
    const fetch = window.fetch.bind(window);
    window.fetch = (input, options) => {
        // Ключ сеанса нужен кнопке «Показать в KiCad» только на сервере этого плагина.
        const request = input instanceof Request ? input : null;
        let sameOrigin = false;
        try {
            const url = new URL(request ? request.url : String(input), location.href);
            sameOrigin = url.origin === location.origin;
        } catch {
            return fetch(input, options);
        }
        if (!sameOrigin) return fetch(input, options);
        const params = Object.assign({}, options);
        const headers = new Headers(params.headers || (request ? request.headers : undefined));
        headers.set('X-DFM-Token', '__DFM_TOKEN__');
        params.headers = headers;
        return fetch(input, params);
    };
})();
</script>
